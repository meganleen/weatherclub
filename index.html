<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Weather Club</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="container">
    <h1>Weather Club</h1>
    <p class="subtitle">Check the weather in any city</p>

    <form id="search-form" autocomplete="off">
      <input
        id="city-input"
        type="text"
        placeholder="Enter a city, e.g. London"
        aria-label="City name"
        required
      />
      <button type="submit">Search</button>
    </form>

    <p id="status" role="status" aria-live="polite"></p>

    <section id="current" class="card" hidden>
      <h2 id="location"></h2>
      <div class="current-main">
        <span id="icon" class="icon" aria-hidden="true"></span>
        <span id="temperature" class="temperature"></span>
      </div>
      <p id="description" class="description"></p>
      <dl class="details">
        <div><dt>Feels like</dt><dd id="feels-like"></dd></div>
        <div><dt>Humidity</dt><dd id="humidity"></dd></div>
        <div><dt>Wind</dt><dd id="wind"></dd></div>
        <div><dt>Precipitation</dt><dd id="precipitation"></dd></div>
      </dl>
    </section>

    <section id="forecast" class="card" hidden>
      <h3>7-day forecast</h3>
      <ul id="forecast-list" class="forecast-list"></ul>
    </section>

    <footer>
      Weather data by <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a>
    </footer>
  </main>

  <script src="app.js"></script>
</body>
</html>
